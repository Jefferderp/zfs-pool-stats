[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zpool-stats"
version = "1.7.5"
description = "A lightweight, dependency-free ZFS pool statistics monitor"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jefferderp" }]
keywords = ["zfs", "openzfs", "zpool", "monitoring"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.scripts]
zpool-stats = "zpool_stats:main"

[project.urls]
Homepage = "https://github.com/Jefferderp/zfs-pool-stats"
Issues = "https://github.com/Jefferderp/zfs-pool-stats/issues"

[tool.setuptools]
py-modules = ["zpool_stats"]
